<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Super Shock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="container-principal">
        <div class="card-central">
        
            <div class="imagem-login">
                <img src="assets/logo.png" alt="" class="imagem-topo-login">
            </div>
            
            <div class="conteudo-card">
                <h2 class="titulo-principal">Super Shock</h2>
                <p class="subtitulo">O heroi mais eletrizante</p>
                
                <div class="abas">
                    <button class="aba ativa" onclick="mostrarAba('login')">Entrar</button>
                    <button class="aba" onclick="mostrarAba('cadastro')">Criar Conta</button>
                </div>
                
                <div id="formLogin" class="formulario-aba ativo">
                    <form id="loginForm">
                        <div class="campo-form">
                            <label>Usuario</label>
                            <input type="text" id="loginUsuario" class="input-text" required>
                        </div>
                        <div class="campo-form">
                            <label>Senha</label>
                            <input type="password" id="loginSenha" class="input-text" required>
                        </div>
                        <div id="loginMensagem" class="mensagem erro d-none"></div>
                        <button type="submit" class="botao-principal">Entrar</button>
                    </form>
                </div>
                
                <div id="formCadastro" class="formulario-aba">
                    <form id="cadastroForm">
                        <div class="campo-form">
                            <label>Usuario</label>
                            <input type="text" id="novoUsuario" class="input-text" required>
                        </div>
                        <div class="campo-form">
                            <label>Senha</label>
                            <input type="password" id="novaSenha" class="input-text" required>
                        </div>
                        <div class="campo-form">
                            <label>Confirmar Senha</label>
                            <input type="password" id="confirmarSenha" class="input-text" required>
                        </div>
                        <div id="cadastroMensagem" class="mensagem erro d-none"></div>
                        <button type="submit" class="botao-principal">Criar Conta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/login.js"></script>
</body>
</html>
